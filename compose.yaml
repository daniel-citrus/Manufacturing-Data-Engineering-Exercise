services:
  backend:
    build: ./backend
    volumes:
      # Read-only, and live: rerunning the notebooks updates the API without a rebuild.
      - ./analysis/data/processed:/app/analysis/data/processed:ro
      # The app's README page shows this file.
      - ./README.md:/app/README.md:ro
    # No published port: the frontend's nginx reaches it as backend:8000 and serves it at /api.

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      # PORT=9000 docker compose up --build serves the app on 9000 instead.
      - "${PORT:-8080}:80"
